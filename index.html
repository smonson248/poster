<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- EDIT: page title shown in the browser tab -->
<title>Stephanie Monson – Poster</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #1d1d1f;
    --muted: #6b6b70;
    --card: #f5f5f7;
    --accent: #0b5cad;
    --border: #e2e2e6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111113;
      --text: #f2f2f4;
      --muted: #a0a0a8;
      --card: #1c1c1f;
      --accent: #6aa8ff;
      --border: #2c2c30;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 48px; }
  header { margin-bottom: 28px; }
  .eyebrow { color: var(--muted); font-size: 0.9rem; margin: 0 0 6px; }
  h1 { font-size: 1.6rem; line-height: 1.25; margin: 0 0 10px; }
  .author { margin: 0; font-weight: 600; }
  .affil { margin: 0; color: var(--muted); }
  h2 { font-size: 1.1rem; margin: 32px 0 12px; }
  .buttons { display: flex; flex-wrap: wrap; gap: 10px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 18px; border-radius: 10px;
    background: var(--accent); color: #fff; text-decoration: none; font-weight: 600;
  }
  .btn.secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  figure { margin: 0 0 24px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  figure video, figure img { display: block; width: 100%; height: auto; background: #000; }
  figcaption { padding: 10px 14px; font-size: 0.95rem; color: var(--muted); }
  footer { margin-top: 40px; font-size: 0.85rem; color: var(--muted); }
</style>
</head>
<body>
<main>

  <!-- ===================== HEADER ===================== -->
  <header>
    <!-- EDIT: conference name and poster number -->
    <p class="eyebrow">CONFERENCE NAME 2026 · Poster #___</p>
    <!-- EDIT: poster title -->
    <h1>POSTER TITLE GOES HERE</h1>
    <p class="author">Stephanie Monson</p>
    <!-- EDIT: department / lab / university -->
    <p class="affil">Chemical and Biomolecular Engineering, University of Pennsylvania</p>
  </header>

  <!-- ===================== CONTACT ===================== -->
  <h2>Contact</h2>
  <div class="buttons">
    <!-- EDIT: replace you@example.com (in BOTH places on the next line) with your email -->
    <a class="btn" href="mailto:smonson@engineering.upenn.edu">✉️ smonson@engineering.upenn.edu</a>
    <!-- EDIT: replace the LinkedIn link with your profile URL -->
    <a class="btn secondary" href="https://www.linkedin.com/in/stephanie-monson/" target="_blank" rel="noopener">in&nbsp;LinkedIn</a>
  </div>

  <!-- ===================== PDFs ===================== -->
  <h2>Poster &amp; documents</h2>
  <div class="buttons">
    <!-- Upload each PDF to the repo with the file name shown in href="..." (or change the name here to match your file). -->
    <!-- EDIT: the text between > and </a> is the button label. -->
    <a class="btn" href="files/Stephanie_Monson_poster.pdf" target="_blank" rel="noopener">📄 Poster (PDF)</a>
    <!-- To add another PDF, copy one of the lines above. To remove one, delete its line. -->
  </div>

  <!-- ===================== ANIMATIONS ===================== -->
  <h2>Animations</h2>

  <!-- Figure 1. Upload a file named fig1.mp4 to the repo (or change the name below). -->
  <figure>
    <video src="files/1x_n120_high_ens276_particle_light.mp4" autoplay muted loop playsinline controls></video>
    <!-- EDIT: caption -->
    <figcaption>Figure 1. Caption describing this animation.</figcaption>
  </figure>

  <!-- Figure 2 -->
  <figure>
    <video src="files/Oct9_clath_excess_area_sweep-fc56c82ac9_ENS-3_presentation_side.mp4" autoplay muted loop playsinline controls></video>
    <figcaption>Figure 2. Caption describing this animation.</figcaption>
  </figure>

  <!-- Figure 3 -->
  <figure>
    <video src="fig3.mp4" autoplay muted loop playsinline controls></video>
    <figcaption>Figure 3. Caption describing this animation.</figcaption>
  </figure>

  <!-- Figure 4 -->
  <figure>
    <video src="fig4.mp4" autoplay muted loop playsinline controls></video>
    <figcaption>Figure 4. Caption describing this animation.</figcaption>
  </figure>

  <!-- To add more figures, copy a whole <figure>...</figure> block and change the file name.
       To remove one you don't need, delete its whole <figure>...</figure> block. -->


  <!-- If an animation is a GIF instead of an MP4, use this form instead:
  <figure>
    <img src="fig5.gif" alt="Short description of the animation">
    <figcaption>Figure 5. Caption.</figcaption>
  </figure>
  -->

  <footer>Thanks for stopping by!</footer>
</main>
</body>
</html>
